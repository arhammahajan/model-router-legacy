[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-model-router"
version = "0.3.0"
description = "A LiteLLM-backed router with bidirectional OpenAI/Anthropic API translation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.106.4,<2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
model-router = "model_router:main"

[tool.setuptools]
py-modules = ["model_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
