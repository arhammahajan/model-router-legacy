[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-model-router"
version = "0.3.0"
description = "A LiteLLM-backed router with bidirectional OpenAI/Anthropic API translation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "litellm[mcp]==1.106.4",
    "httpx==0.28.1",
    "tomli==2.5.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "tomli==2.5.0"] # exercise Python 3.10 TOML fallback on newer Python too
dev = ["build==1.6.1", "mypy==2.4.0", "ruff==0.17.2"]

[project.scripts]
model-router = "model_router.cli:main"

[tool.setuptools]
packages = ["model_router", "router_metadata"]

[tool.setuptools.package-data]
router_metadata = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Achievable correctness baseline across the existing module and local tests.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["router_metadata", "scripts/check_release.py"]
follow_imports = "skip"
check_untyped_defs = true
