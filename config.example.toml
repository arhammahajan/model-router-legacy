# Example configuration for model_router.py.
#
# Copy to router.toml (the default lookup name) and edit.
# Every string supports ${ENV_VAR} expansion; missing/empty variables are errors.
# The router also auto-loads
# ~/.config/ai/credentials.env (or $XDG_CONFIG_HOME/ai/credentials.env) before
# reading this file; existing environment variables win.

[server]
host = "127.0.0.1"
port = 4000

# Explicit local unauthenticated mode; ignores MODEL_ROUTER_API_KEY(S).
auth_mode = "none"
# To require client auth, replace the line above with:
# auth_mode = "required"
# api_keys = ["${MODEL_ROUTER_API_KEY}"] # missing/empty => startup error
# Clients send Authorization: Bearer <key>, x-api-key: <key>, or api-key: <key>.

# Compatibility default is true. False permits only explicit/discovered routes.
allow_dynamic_routes = false

# Optional request body limit, applied both before and after decompression.
max_body_bytes = 67108864

# Bound admission before starting handlers; overloaded work gets HTTP 503.
max_connections = 32
max_generations = 8             # positive, <= max_connections; no waiting queue
header_read_timeout = 10        # absolute seconds for request line + headers
body_read_timeout = 30          # absolute seconds for body + chunk framing
write_timeout = 30              # seconds per downstream write, not stream duration
# Provider timeout independently controls upstream generation/read waits.

# One policy for direct forwarding and all LiteLLM translations. Attempts include
# the initial send. Default 1 disables replay; opt in with max_attempts = 3.
# A retry can duplicate generation/billing even after an upstream 429/503.
[retry]
max_attempts = 1                 # integer 1..20, same provider/model on every attempt
statuses = [429, 503]            # only 429 or HTTP 5xx are configurable
connect_errors = true           # retry ConnectError/ConnectTimeout before HTTP send
backoff_base = 0.5               # exponential cap, seconds; jitter in [cap/2, cap]
backoff_max = 8                  # cap excludes a longer Retry-After minimum
deadline = 600                  # total dispatch + upstream IO + backoff + stream time
# Retry-After seconds/HTTP dates are honored. Unaffordable waits return 504.
# Read/write timeouts, truncated responses and SSE failures are never replayed.

# Optional discovery persistence; omitted by default. Uncomment this table to
# retain availability/selected metadata across restarts, with private POSIX files.
# Endpoints/headers/credentials always come from current trusted configuration.
# max_age_seconds limits admission on restart; admitted routes retain the existing
# in-memory stale-route policy until successful discovery replaces/removes them.
# [discovery_cache]
# path = "~/.cache/model-router/discovery.json"
# max_age_seconds = 86400

# ---------------------------------------------------------------------------
# Providers: one entry per upstream endpoint.
#
# dialect is what the upstream speaks:
#   "openai-chat"      -> POST <base_url>/chat/completions
#   "openai-responses" -> POST <base_url>/responses
#   "anthropic"        -> POST <base_url>/v1/messages
#   "gemini"           -> LiteLLM's Gemini protocol (generateContent)
#
# For OpenAI dialects, include the version path in base_url (usually /v1).
# For Anthropic, use the origin (https://api.anthropic.com) or a prefix; LiteLLM
# appends /v1/messages. A base_url ending in /v1/messages is also accepted.
# For Gemini, include /v1beta in base_url. A "gemini" provider is also reachable
# natively through the router's /v1beta/models/{model}:generateContent ingress.
#
# Credential isolation: a nonempty api_key/api_key_env/api_key_file selects that
# key, with surrounding whitespace stripped. Omitted/literal empty api_key values
# send the public "model-router-no-auth" placeholder in both passthrough and
# translated requests; unauthenticated servers must accept/ignore it. Ambient
# environment/global LiteLLM keys never act as fallbacks. Use api_key_env for
# environment references (LiteLLM's os.environ/NAME indirection is rejected).
# Configured api_key_env/api_key_file must resolve to a nonempty value.
# The top-level key takes precedence over duplicates in litellm_kwargs.
# Translation compatibility defaults to "strict": unsupported/unmapped controls
# return HTTP 400. Explicit compatibility = "lossy" removes known losses and
# reports x-model-router-loss on JSON/SSE responses. Legacy drop_params=true
# selects this diagnosed lossy policy; client JSON cannot select either mode.
# Translation forwards only destination-dialect beta/version headers. Trusted
# provider headers override inbound opt-ins case-insensitively; auth wins last.
#
# auth_header (optional): "bearer", "x-api-key", or "api-key" to force how the
#   upstream key is sent. Empty leaves the provider default.
# count_tokens (optional, anthropic dialect only): whether this upstream implements
#   POST <base_url>/v1/messages/count_tokens. Unset assumes yes only for
#   https://api.anthropic.com. Set true after confirming a compatible provider
#   has the endpoint; false disables it. Unsupported routes return HTTP 400
#   rather than an estimate.
# session_header (optional): upstream stable conversation header, e.g.
#   "x-opencode-session". Client must reuse one ID per conversation.
# session_source_headers: ordered subset of reviewed native conversation headers.
#   Default: ["x-claude-code-session-id", "session-id", "session_id", "thread-id",
#             "conversation_id", "x-session-id", "x-mavis-session-id"].
#   [] disables native extraction. MCode sends x-mavis-session-id per session.
#   Explicit session_header always wins; native sources precede the body fallback.
# session_prompt_cache_key = false: opt in to top-level prompt_cache_key fallback.
#   Reuse it per conversation; translated calls consume it as affinity metadata,
#   native calls retain the JSON field. Cache keys shared across chats merge affinity.
# session_missing = "omit": no identity => no session header/affinity. "reject"
#   instead returns HTTP 400. No per-request UUID or prompt-derived ID is generated.
#   These policy options require session_header. Static session headers are forbidden.
#   Identity values: 1-256 ASCII letters/digits/._:/-, leading letter/digit; no
#   whitespace or duplicates. See README for reviewed sources and compatibility.
# ---------------------------------------------------------------------------

[providers.anthropic]
dialect = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
# headers = { "anthropic-beta" = "some-beta-flag" }
# timeout = 600
# compatibility = "strict" # or explicit "lossy" with response diagnostics

[providers.openai]
dialect = "openai-responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

# Any OpenAI-compatible server: vLLM, Ollama, LM Studio, OpenRouter, a gateway.
[providers.local]
dialect = "openai-chat"
base_url = "http://127.0.0.1:11434/v1"
api_key = "ollama"

# A second OpenAI endpoint that speaks Chat Completions.
# [providers.openrouter]
# dialect = "openai-chat"
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# headers = { "HTTP-Referer" = "http://localhost", "X-Title" = "model-router" }

# ---------------------------------------------------------------------------
# Dynamic catalog (optional). Fetches model IDs from an OpenAI-style /v1/models
# endpoint once before listening, then in a managed background worker, exposing
# upstream IDs. Exact model_providers entries win over optional regex rules
# (first matching rule wins). Unmapped IDs are omitted and diagnosed, not
# assigned a default dialect. Explicit [[models]] override catalog routes.
# See router.toml for the reviewed OpenCode Go map and four trusted providers;
# Go models do not all support Responses, even within a single model family.
# ---------------------------------------------------------------------------
# [catalog]
# url = "https://opencode.ai/inference/go/v1/models"
# metadata_source = "opencode-go-v1" # frozen reviewed capabilities; no Models.dev fetch
# refresh_seconds = 300       # 0 = exactly one startup attempt, even on failure
# # Failures retry with jittered exponential backoff (2.5–300 seconds).
# # Model listing, readiness and authenticated /diagnostics read cached state.
# # /livez (also /health, /healthz) returns only status=ok without networking.
#
# [catalog.model_providers]
# "claude-haiku-5-5" = "opencode-anthropic"
# "gemini-4-argon" = "opencode-gemini"
# "gpt-6-luna" = "opencode-openai"
# "deepseek-v4.1-flash" = "opencode-chat"
# "minimax-m3" = "opencode-anthropic"
# "minimax-m3.1-flash" = "opencode-chat"
# "qwen3.8-max" = "opencode-anthropic"
# Values above require the [providers.opencode-*] definitions from router.toml.

# ---------------------------------------------------------------------------
# Automatic llama.cpp discovery (optional).
#
# Every server is probed once before listening, then in the background. Models, aliases,
# context size and capabilities are read from /health, /v1/models and /props.
# Single-model, router (--models-preset), legacy (ik_llama.cpp), llama-swap,
# and Strata/PolyStrata servers are recognized. Strata is identified by its
# /props build_info and keeps native reasoning_effort controls. Discovered
# models use OpenAI Chat, and are translated for other ingresses.
# Provider identities are reserved before probing, including unavailable servers.
# Explicit names must be unique across servers and static providers. Generated
# URL names use -2, -3, etc. on collision in config order, independent of health.
#
# A config may consist only of [llama_cpp]. If "servers" and "ports" are both
# omitted, LLAMA_SERVER_URL (semicolon/comma separated) is used, then
# http://127.0.0.1:9931.
# ---------------------------------------------------------------------------
# [llama_cpp]
# compatibility = "strict"   # "lossy" permits diagnosed cross-protocol approximation
# servers = ["http://127.0.0.1:9931"]
# # Or scan fixed localhost ports:
# # ports = [9931, 8080]
# # Per-server name, key and headers:
# # servers = [{ url = "http://127.0.0.1:8080", name = "local", api_key_env = "LLAMA_API_KEY" }]
#
# refresh_seconds = 30        # 0 = exactly one startup attempt, even on failure
# # Any failed server backs off the discovery round; successful servers update
# # while failed servers retain their last usable routes. No on-disk cache.
# timeout = 2                 # per-probe timeout
# context_fallback = 128000   # labeled fallback, never a measured runtime limit
# prefix = ""                 # e.g. "llama/" to namespace discovered models
# aliases = true              # expose llama.cpp model aliases as routes
# api_key_env = "LLAMA_API_KEY"  # usually unnecessary for localhost
# headers = { "User-Agent" = "litellm-model-router/0.3.0" }
#
# Optional reporting overrides by exact upstream model ID, before prefix/aliases.
# Explicit overrides win over discovered reports, launch estimates and fallback.
# They do not reconfigure/enforce server limits. Unspecified output maxima stay
# unknown: discovered max_tokens now means max_output_tokens, not context size.
# [llama_cpp.limit_overrides."my-model-id"]
# context_window = 8192
# trained_context_window = 131072
# max_input_tokens = 8000
# max_output_tokens = 2048
# default_output_tokens = 256

# Version 1 advisory capability overrides enrich a discovered route without
# redeclaring its routing. Keys are canonical public IDs, INCLUDING any prefix.
# Omit unknown fields; JSON configs can use null to withdraw a claim.
# These are operator assertions for your verified build/template; no default
# reasoning enum is assumed. See docs/capabilities.md for schema and client usage.
# [capabilities.overrides."llama/my-model-id".reasoning]
# supported = true
# [capabilities.overrides."llama/my-model-id".reasoning.effort]
# supported = true
# values = ["small", "large"] # only if established for this exact model/template
# default = "small"
# native_parameter = { protocol = "openai-chat", path = "reasoning_effort" }
# [capabilities.overrides."llama/my-model-id".tools]
# parallel = false

# ---------------------------------------------------------------------------
# Models: the public names clients send. Provider dialect can be overridden per
# route if one endpoint exposes both protocols. "aliases" are additional names.
# ---------------------------------------------------------------------------

[[models]]
name = "claude-sonnet"
provider = "anthropic"
model = "claude-sonnet-4-5-20250929"
aliases = ["claude", "anthropic/claude-sonnet-4-5"]
metadata = { display_name = "Claude Sonnet 4.5", context_window = 200000 }

[[models]]
name = "claude-haiku"
provider = "anthropic"
model = "claude-haiku-4-5-20250929"

[[models]]
name = "gpt-5"
provider = "openai"
model = "gpt-5"

[[models]]
name = "local-llama"
provider = "local"
model = "llama3.1"

# With server.allow_dynamic_routes = true, an unlisted "provider/model-id" is
# sent using that provider's default dialect. For example:
#   model = "local/qwen2.5-coder:7b"
# Disabled aliases alone are not a model access-control policy: dynamic IDs,
# other aliases and discovered/catalog routes can still expose the same model.
