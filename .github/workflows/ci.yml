name: Local contracts and release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      DO_NOT_TRACK: "True"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints.txt
      - name: Build sdist and wheel from the sdist
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -c constraints.txt build
          python -m build
      - name: Install runtime wheel and tested dependencies
        shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install -c constraints.txt "${wheels[0]}"
          python -m pip check
      - name: Installed entry point, version, resources and default config
        run: python scripts/check_release.py
      - name: Install test and check tools
        shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install -c constraints.txt "${wheels[0]}[test,dev]"
          python -m pip check
      - name: Full local suite against the installed package
        working-directory: ${{ runner.temp }}
        run: python -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests"
      - name: Scoped correctness lint
        run: python -m ruff check model_router.py model_router router_metadata scripts tests
      - name: Scoped types
        run: python -m mypy
