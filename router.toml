# OpenCode Go router.
#
# Credentials are auto-loaded from ~/.config/ai/credentials.env, so
# OPENCODE_API_KEY does not need to be exported in the shell.
#
#   .venv/bin/python model_router.py
#
# Clients use http://127.0.0.1:4000/v1 with any placeholder API key.

[server]
host = "127.0.0.1"
port = 4000
# Intentional local unauthenticated mode. For client authentication use
# auth_mode = "required" and api_keys = ["${MODEL_ROUTER_API_KEY}"].
# Missing/empty substitutions fail startup; "none" ignores auth env variables.
auth_mode = "none"
# Only reviewed explicit/catalog/discovered routes; no provider/model bypass.
allow_dynamic_routes = false
max_body_bytes = 67108864

# Bound admission before starting handlers; overloaded work gets HTTP 503.
max_connections = 32
max_generations = 8             # positive, <= max_connections; no waiting queue
header_read_timeout = 10        # absolute seconds for request line + headers
body_read_timeout = 30          # absolute seconds for body + chunk framing
write_timeout = 30              # seconds per downstream write, not stream duration
# Provider timeout independently controls upstream generation/read waits.

# The public catalog supplies availability, not endpoint compatibility. Only
# reviewed exact IDs below become routes. Unmapped IDs are omitted from
# /v1/models, reported in authenticated /diagnostics catalog.unmapped_models, and rejected on use.
[catalog]
url = "https://opencode.ai/inference/go/v1/models"
metadata_source = "opencode-go-v1" # bundled reviewed capabilities; availability stays live
refresh_seconds = 300
headers = { "User-Agent" = "litellm-model-router/0.3.0" }

# Mapping revision 1, reviewed 2026-10-26 against the official endpoint table:
# https://opencode.ai/v2/docs/console/go/#endpoints
# These are documented native endpoints, not proof of live compatibility.
# Other endpoints and catalog-only IDs remain unknown; no prefix/catch-all.
# Edit an exact entry to override; explicit [[models]] routes take precedence.
# Credentials and URLs belong only in the trusted [providers] configuration.
[catalog.model_providers]
"grok-4.7" = "opencode-openai"
"gpt-6-luna" = "opencode-openai"
"gpt-5.6-luna" = "opencode-openai"
"claude-haiku-5-5" = "opencode-anthropic"
"gemini-4-argon" = "opencode-gemini"
"glm-5.3-flash" = "opencode-chat"
"glm-5.3" = "opencode-chat"
"glm-5.2" = "opencode-chat"
"kimi-k3.1-pro" = "opencode-chat"
"kimi-k3" = "opencode-chat"
"kimi-k2.7-code" = "opencode-chat"
"longcat-2.0" = "opencode-chat"
"deepseek-v4.1-flash" = "opencode-chat"
"deepseek-v4-pro" = "opencode-chat"
"mimo-v2.6-flash" = "opencode-chat"
"mimo-v2.6-pro" = "opencode-chat"
"mimo-v2.5" = "opencode-chat"
"mimo-v2.5-pro" = "opencode-chat"
"minimax-m3.1-flash" = "opencode-chat"
"minimax-m3" = "opencode-anthropic"
"muse-spark-1.3-contributor" = "opencode-openai"
"muse-spark-1.2-contributor" = "opencode-openai"
"qwen3.8-max" = "opencode-anthropic"
"qwen3.8-flash" = "opencode-anthropic"
"qwen3.7-plus" = "opencode-anthropic"
"hy4-preview" = "opencode-chat"
"hy3" = "opencode-chat"
"step-5-preview" = "opencode-chat"
"beam-free" = "opencode-chat"

[providers.opencode-chat]
compatibility = "lossy" # All harness protocols; report approximated/dropped controls.
dialect = "openai-chat"
base_url = "https://opencode.ai/inference/go/openai/v1"
api_key_env = "OPENCODE_API_KEY"
session_header = "x-opencode-session"
session_prompt_cache_key = true # explicit fallback; client must keep it per conversation
session_missing = "omit"       # no supplied ID => no affinity; use "reject" to require one
headers = { "User-Agent" = "litellm-model-router/0.3.0" }
timeout = 600

[providers.opencode-openai]
compatibility = "lossy"
dialect = "openai-responses"
base_url = "https://opencode.ai/inference/go/openai/v1"
api_key_env = "OPENCODE_API_KEY"
session_header = "x-opencode-session"
session_prompt_cache_key = true
session_missing = "omit"
headers = { "User-Agent" = "litellm-model-router/0.3.0" }
timeout = 600

[providers.opencode-anthropic]
compatibility = "lossy"
dialect = "anthropic"
base_url = "https://opencode.ai/inference/go/anthropic"
api_key_env = "OPENCODE_API_KEY"
auth_header = "x-api-key"
session_header = "x-opencode-session"
session_prompt_cache_key = true
session_missing = "omit"
headers = { "User-Agent" = "litellm-model-router/0.3.0" }
timeout = 600

[providers.opencode-gemini]
compatibility = "lossy"
dialect = "gemini"
base_url = "https://opencode.ai/inference/go/google/v1beta"
api_key_env = "OPENCODE_API_KEY"
auth_header = "bearer"
session_header = "x-opencode-session"
session_prompt_cache_key = true
session_missing = "omit"
headers = { "User-Agent" = "litellm-model-router/0.3.0" }
timeout = 600

# Local llama.cpp / llama-swap servers are discovered automatically. Models
# appear in /v1/models alongside the OpenCode catalog, with their context size
# and aliases. LLAMA_SERVER_URL overrides the server list. Delete this section
# to turn discovery off.
[llama_cpp]
compatibility = "lossy"
servers = ["http://127.0.0.1:9931"]
refresh_seconds = 30
timeout = 1
headers = { "User-Agent" = "litellm-model-router/0.3.0" }
